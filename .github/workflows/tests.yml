name: tests

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    name: unittest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
        include:
          - os: ubuntu-latest
            python: "3.8"
          - os: windows-latest
            python: "3.8"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      # The DST tests read IANA zones with zoneinfo, and Windows has no zone
      # database of its own: the tzdata package, for the tests only (glidepath
      # stays stdlib only). Python 3.8 has no zoneinfo, so they skip there.
      - name: Install a zone database for the tests (Windows)
        if: runner.os == 'Windows'
        run: python -m pip install tzdata
      - name: Run the test suite
        run: python -m unittest discover -s tests -t . -v

  mod:
    name: mod (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate the mod
        run: claude plugin validate mods/glidepath
      - name: Test the mod
        run: claude plugin test mods/glidepath

  # scripts/ci_integration.py, in throwaway folders: glidepath install, the
  # statusLine command piped a payload through each shell Claude Code may run
  # it with (Git Bash, pwsh and powershell.exe on Windows; /bin/sh on macOS),
  # uninstall back to the same bytes; and which forms of the repo path
  # `claude plugin marketplace add` accepts (reported, never failing).
  windows-integration:
    name: windows-integration
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install Claude Code
        continue-on-error: true
        run: npm install -g @anthropic-ai/claude-code
      - name: Install, the statusLine through Git Bash, pwsh and powershell.exe, uninstall
        run: python scripts/ci_integration.py
      # Report only: a fresh process per render, as Claude Code runs it (budget: p95 100 ms).
      - name: Time the statusline
        run: python -X utf8 scripts/bench_statusline.py --runs 50

  macos-integration:
    name: macos-integration
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install Claude Code
        continue-on-error: true
        run: npm install -g @anthropic-ai/claude-code
      - name: Install, the statusLine through /bin/sh, uninstall
        run: python scripts/ci_integration.py
      - name: Time the statusline
        run: python -X utf8 scripts/bench_statusline.py --runs 50
